name: quality

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest --cov=preference_classifier --cov-report=term-missing --cov-fail-under=50 -q
      - run: python -m compileall -q src
      - run: python -m preference_classifier.cli demo --output-dir .ci-demo
      - run: python scripts/audit_public_repo.py
